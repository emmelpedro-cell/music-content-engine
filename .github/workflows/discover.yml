name: ffmpeg-discover
on: push
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: List LGPL assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=autobuild-2026-09-30-13-08
          gh release view "$TAG" -R BtbN/FFmpeg-Builds --json assets --jq '.assets[].name' > names.txt
          grep -E 'n9.0.2.*(win64|linux64)-lgpl-shared' names.txt | sort > lgpl.txt
          out=""
          for n in $(cat lgpl.txt); do
            curl -sSL -o "$n" "https://github.com/BtbN/FFmpeg-Builds/releases/download/$TAG/$n"
            out="$out$(sha256sum "$n" | cut -d' ' -f1) $(stat -c %s "$n") $n%0A"
            mkdir -p x && (cd x && (unzip -q "../$n" 2>/dev/null || tar -xJf "../$n")) && out="$out$(cd x && find . -type f \( -path "*/bin/*" -o -path "*/lib/*.so*" \) | sed "s|^./[^/]*/||" | sort | tr "\n" " ")%0A" && rm -rf x "$n"
          done
          echo "::notice title=lgpl-assets::$out"
          echo "::notice title=all-names::$(tr '\n' ' ' < names.txt | head -c 3500)"
