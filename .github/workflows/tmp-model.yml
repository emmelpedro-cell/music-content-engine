# Temporary: fetches a speech model into a draft release for a local transcription test. Removed right after.
name: tmp-model
on:
  push:
    paths: ['.github/workflows/tmp-model.yml']
permissions:
  contents: write
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify
        run: |
          curl -fsSL -o ggml-large-v3-turbo-q5_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          echo "394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2  ggml-large-v3-turbo-q5_0.bin" | sha256sum -c -
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create tmp-model --repo ${{ github.repository }} --draft --target ${{ github.sha }} --title "tmp model (delete)" --notes "temporary" ggml-large-v3-turbo-q5_0.bin
